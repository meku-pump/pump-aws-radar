[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-radar-test"
version = "0.1.0"
description = "Fork of aws-radar that pushes AWS inventory + billing CSVs to Pump's self-serve onboarding"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Pump" },
]
maintainers = [
  { name = "Pump" },
]
keywords = ["aws", "cloud", "inventory", "cost-explorer", "billing", "finops", "pump", "onboarding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "boto3>=1.34.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "build",
  "twine",
]

[project.urls]
Homepage   = "https://github.com/meku-pump/aws-radar-test"
Repository = "https://github.com/meku-pump/aws-radar-test"
Upstream   = "https://github.com/gomorsmi/aws-radar"

[project.scripts]
aws-radar = "aws_radar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
